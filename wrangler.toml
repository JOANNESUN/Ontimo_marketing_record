name = "ontimo-marketing-record"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "ontimo-marketing-record"
# Replace with the id printed by: npx wrangler d1 create ontimo-marketing-record
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ontimo-marketing-photos"
